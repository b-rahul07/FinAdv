# Every push: the backend tests, and the web app's type-check, tests and production build.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The core install is enough: document search, news and CAS parsing are optional and the tests use stand-ins.
      - run: pip install -e . pytest numpy
      - name: Tests
        run: |
          set -o pipefail
          python -m pytest -rfE --tb=short 2>&1 | tee pytest.log
      - name: Name the failed tests on the run page
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do echo "::error::$line"; done
          { echo '```'; tail -n 60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm test
      - run: npm run build
