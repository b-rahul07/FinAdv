# Daily prices without the laptop: the same job the laptop runs (python -m finadvisor.market.jobs daily), against the
# production database. It needs one repository secret, DATABASE_URL (Settings > Secrets and variables > Actions); the
# job stops with a clear message when the secret is missing. GitHub runs schedules only from the default branch, so
# this starts once the file is on that branch; "Run workflow" on the Actions tab runs it by hand at any time.
name: Daily prices

on:
  schedule:
    # 14:00 UTC = 7:30 pm IST, after the NSE and BSE end-of-day files; 18:00 UTC = 11:30 pm IST, after AMFI's NAVs.
    - cron: "0 14 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check the secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the repository secret DATABASE_URL (the Supabase connection string) to run this job."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[postgres]"
      - name: Fetch and store today's prices
        run: python -m finadvisor.market.jobs daily
