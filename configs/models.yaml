# Model identities. Every generation records provider, exact tag, digest/quantisation,
# temperature, seed and prompt-template version.
# self_hosted: false models may be used ONLY for synthetic benchmark data (brief §2.6).
models:
  # The website's model (settings.model_name = "site") since 14 Nov 2026: phi4-mini, MIT licence. Chosen after the
  # paper's runs from M1 (first plans passed 65% vs 39% for qwen2.5:3b) and the advice evaluation on the website's
  # CPU host (same safety checks passed; median reply about 14 s against 8 s, streamed). The website plans with the
  # standard mix, so the model explains, reads facts from chat and answers Learn questions.
  site:
    provider: ollama
    model: phi4-mini
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 400}
  # "website": qwen2.5:3b (Q4_K_M via Ollama), the website's model until 14 Nov 2026 and the main model of every
  # reported paper run (their configs say `model: website`; keep this entry unchanged so they re-run as reported).
  # Chosen then over phi4-mini for planner speed on a CPU (~10-22 s vs ~30-45 s per planner call). Licence: Qwen
  # Research License (non-commercial use only).
  website:
    provider: ollama
    model: qwen2.5:3b
    self_hosted: true
    options:
      temperature: 0
      seed: 42
      num_ctx: 4096
      num_predict: 400
  phi4-mini:
    provider: ollama
    model: phi4-mini
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 400}
  # Model-size and family comparison for the paper (run M1). Same options as the website model. Licences: Qwen2.5
  # 1.5B and 7B Apache 2.0; Phi-4-mini MIT; Llama 3.2 3B Llama 3.2 Community License.
  qwen2.5-1.5b:
    provider: ollama
    model: qwen2.5:1.5b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 400}
  qwen2.5-7b:
    provider: ollama
    model: qwen2.5:7b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 400}
  llama3.2-3b:
    provider: ollama
    model: llama3.2:3b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 400}
  # Follow-up runs (15 Nov 2026): the baselines with a longer answer budget. At num_predict 400, 29% of B1 answers
  # repeated a line four or more times and many ended mid-sentence; these entries test whether the baselines'
  # unsuitable rate is an artefact of the budget. Same model, quantisation and seed as `website` and `qwen2.5-7b`.
  website-long:
    provider: ollama
    model: qwen2.5:3b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 1200}
  qwen2.5-7b-long:
    provider: ollama
    model: qwen2.5:7b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 1200}
  # Follow-up (15 Nov 2026, after the draft review): the baselines with qwen2.5 14B (Q4_K_M, about 9 GB; fits a T4),
  # same options as qwen2.5-7b-long. Licence: Apache 2.0.
  qwen2.5-14b-long:
    provider: ollama
    model: qwen2.5:14b
    self_hosted: true
    options: {temperature: 0, seed: 42, num_ctx: 4096, num_predict: 1200}
  tiny-test:
    provider: fake
    model: scripted
    self_hosted: true
    options: {temperature: 0, seed: 0}
