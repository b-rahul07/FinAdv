[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finadvisor"
version = "0.1.0"
description = "FinAdvisor: suitable-by-construction personal finance advisor and tracker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6",
  "python-dotenv>=1",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",   # IST (Asia/Kolkata) on Windows, which has no system time-zone database
  "python-multipart>=0.0.9",   # file uploads (CAS statements)
]

[project.optional-dependencies]
rag = ["chromadb>=0.5", "sentence-transformers>=3"]          # document search (falls back to keywords without it)
news = ["feedparser>=6", "transformers>=4.40", "torch>=2.2"]  # market headlines with FinBERT mood
cas = ["casparser>=0.7"]                                       # CAS statement import
postgres = ["psycopg[binary]>=3.1"]                            # Supabase / Postgres in production
dev = ["pytest>=8", "playwright>=1.45"]
all = ["finadvisor[rag,news,cas,postgres,dev]"]

[tool.setuptools.packages.find]
include = ["finadvisor*"]

[tool.setuptools.package-data]
"finadvisor.retrieval" = ["documents/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
