[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finadvisor"
version = "0.1.0"
description = "FinAdvisor: suitable-by-construction personal finance advisor and tracker"
requires-python = ">=3.11"
# Upper bounds stop at the next major version: casparser 1.x changed its return type and broke the CAS import while
# the tests (which mocked it) stayed green (14 Nov 2026). Raise a bound after the contract tests pass on the new major.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13",
  "httpx>=0.27,<1",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6",
  "python-dotenv>=1",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",   # IST (Asia/Kolkata) on Windows, which has no system time-zone database
  "python-multipart>=0.0.9",   # file uploads (CAS statements)
]

[project.optional-dependencies]
rag = ["chromadb>=0.5,<2", "sentence-transformers>=3,<7"]          # document search (falls back to keywords without it)
news = ["feedparser>=6,<7", "transformers>=4.40,<6", "torch>=2.2,<3"]  # market headlines with FinBERT mood
cas = ["casparser>=1.4,<2"]   # CAS import; 1.x returns a model, which cas.read handles (tested with the real parser)
postgres = ["psycopg[binary]>=3.1,<4"]                            # Supabase / Postgres in production
dev = ["pytest>=8", "playwright>=1.45"]
all = ["finadvisor[rag,news,cas,postgres,dev]"]

[tool.setuptools.packages.find]
include = ["finadvisor*"]

[tool.setuptools.package-data]
"finadvisor.retrieval" = ["documents/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
